version: '3.8'

services:
  backend:
    build:
      context: ./backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/laravel_db
      - SPRING_DATASOURCE_USERNAME=laravel_user
      - SPRING_DATASOURCE_PASSWORD=laravel_password
    depends_on:
      - db
    networks:
      - realestate-network

  frontend:
    build:
      context: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - realestate-network

  db:
    image: mysql:5.7
    restart: always
    environment:
      MYSQL_DATABASE: laravel_db
      MYSQL_USER: laravel_user
      MYSQL_PASSWORD: laravel_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - realestate-network

networks:
  realestate-network:
    driver: bridge

volumes:
  db-data:
    driver: local
